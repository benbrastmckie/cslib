name: Lean Action CI

on:
  push:
    branches:
      - main
      - nightly-testing
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set TEST_ARGS manually
        run: |
          echo "TEST_ARGS=''" >> $GITHUB_ENV
        shell: bash
      # The next two steps are new, local (non-upstream) additions to this shared, synced
      # workflow file. Adding steps here is a deliberate divergence-cost tradeoff: every future
      # sync from upstream now carries a conflict hunk at this point. The two preceding local
      # ratchet guards in this repo (scripts/check-lint-suppressions.sh,
      # scripts/check-shake-residue.sh) both chose the OPPOSITE tradeoff -- they live only in
      # lint-hygiene.yml / pre-pr-check.sh, never in this file -- specifically to avoid that
      # sync cost. This pair is wired in here anyway because it is an explicit, written scope
      # requirement for these two gates specifically; the sync-conflict cost is accepted, not
      # overlooked.
      #
      # Placement: the sorry-suppression gate is Lean-free (a pure text sweep) and placed
      # BEFORE the lean-action build step below, so it runs unconditionally and fails fast. The
      # axiom-census gate needs built .olean files, so it is placed AFTER the build step and
      # carries `if: always()`. That `if: always()` is not optional: the build step above has no
      # `continue-on-error`, and `lake build --wfail --iofail` is currently RED on this tree by
      # design (4 files carry bare, genuinely-unsuppressed sorries -- an accepted, out-of-scope
      # condition, see this repo's own sorry-suppression baseline). Without `if: always()`, a
      # step placed after an already-failing build step would never execute at all -- a gate
      # that never runs is not a gate. If the census step itself shows red in a run, read that
      # as "the build is broken" first (it exits 2, never a silent clean pass, when it cannot
      # find built .olean files) -- NOT as "the census found new taint" -- and check the build
      # step's own result before investigating the census.
      - name: "sorry-suppression ratchet"
        run: |
          set -e
          bash scripts/check-sorry-suppressions.sh
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail --iofail"
          test-args: ""
      - name: "axiom-census ratchet"
        if: always()
        run: |
          set -e
          bash scripts/check-axiom-census.sh
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      # "lake shake" is disabled here, matching upstream's own disposition for this step
      # (upstream commit 74600063621f66f0dbfbac31963cd1219e0e05ed, "ci: disable shake again
      # (#397)") -- re-commenting it shrinks this fork's divergence from upstream rather than
      # growing it, since this fork's copy previously had the step enabled where upstream does
      # not.
      #
      # Audit: as of 2026-07-28, against upstream SHA
      # f36649cff2c9d9fa1f91a848caa5c5a6f9d6bab1, `lake shake --add-public --keep-implied
      # --keep-prefix Cslib` flags a residue of files that are all byte-identical to that
      # upstream SHA -- i.e. upstream's own unresolved import-minimization debt, not this
      # fork's. Selective per-file exemption was considered and rejected: the `-- shake: keep`
      # / `module -- shake: keep-all` annotation mechanism exists in this repo, but using it here
      # would require editing the flagged (pristine, upstream-identical) files, and `keep-all`
      # only suppresses *removal* findings while most of the residue needs an *addition* --
      # module-scoping via positional args cannot exclude them either, since several are import
      # hubs with wide fan-in.
      #
      # Local enforcement is NOT dropped: scripts/check-shake-residue.sh +
      # scripts/shake-residue-baseline.txt is a local (non-CI) guard, run as step 7 of
      # scripts/pre-pr-check.sh, that fails whenever this fork's own changes introduce shake-
      # flaggable import debt beyond the frozen baseline. It is deliberately not added as a new
      # step here: this is a shared, synced workflow file, and a new step adds a conflict hunk to
      # every future sync (the guard also needs built `.olean` files, so it cannot join the
      # Lean-free `lint-hygiene.yml` workflow instead). Wiring it into CI directly is a deferred
      # option, not exercised this round.
      # - name: "lake shake"
      #   run: |
      #     set -e
      #     lake shake --add-public --keep-implied --keep-prefix Cslib
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      - uses: leanprover-community/lint-style-action@e6128ab22cb03b509075ae46c33727e3952ffab7 # 2026-05-12
        with:
          mode: check
